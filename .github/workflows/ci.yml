name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Rust format and lints
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --release

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Determinism (native vs WASM checksums)
        run: ./scripts/check-determinism.sh

      - name: Client typecheck and build
        working-directory: client
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: client/dist
          retention-days: 14

  # Uploads the site to Majordomo over FTP once the secrets exist (see README, "Хостинг").
  # main goes to the site root, any other branch to preview/<branch>/ for testing before merge.
  # Without the secrets the job just leaves a notice.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - name: Skip without FTP secrets
        if: env.FTP_HOST == '' || env.FTP_USER == '' || env.FTP_PASSWORD == '' || env.FTP_DIR == ''
        run: echo "::notice::Деплой пропущен - не заданы секреты FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR."

      - uses: actions/download-artifact@v4
        if: env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASSWORD != '' && env.FTP_DIR != ''
        with:
          name: site
          path: site

      - name: Upload to Majordomo
        if: env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASSWORD != '' && env.FTP_DIR != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            target="$FTP_DIR"
          else
            target="$FTP_DIR/preview/$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9-' '-')"
          fi
          # Only assets/ is mirrored with --delete: it holds nothing but hashed build output.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow yes; set net:max-retries 3; set net:timeout 30;
            mkdir -p -f $target;
            mirror -R --no-perms --exclude-glob assets/ site $target;
            mirror -R --no-perms --delete site/assets $target/assets;
            bye"
          echo "::notice::Загружено в $target"
